<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="b-tile"><rect x="32" y="32" width="960" height="960" rx="220"/></clipPath>
    <radialGradient id="b-bg" cx="0.5" cy="0.42" r="0.7"><stop offset="0" stop-color="#1f232c"/><stop offset="1" stop-color="#07080a"/></radialGradient>
    <radialGradient id="b-glow"><stop offset="0" stop-color="#f5b52e" stop-opacity="0.38"/><stop offset="1" stop-color="#f5b52e" stop-opacity="0"/></radialGradient>
    <radialGradient id="b-iris" cx="0.5" cy="0.42" r="0.58"><stop offset="0" stop-color="#fff0a0"/><stop offset="0.55" stop-color="#ffc933"/><stop offset="1" stop-color="#e08a06"/></radialGradient>
  </defs>
  <g clip-path="url(#b-tile)">
    <!-- Night tile -->
    <rect x="32" y="32" width="960" height="960" fill="url(#b-bg)"/>
    <!-- Glow around each eye -->
    <circle cx="352" cy="540" r="270" fill="url(#b-glow)"/>
    <circle cx="672" cy="540" r="270" fill="url(#b-glow)"/>
    <!-- Eyes -->
    <circle cx="352" cy="540" r="150" fill="url(#b-iris)"/>
    <circle cx="672" cy="540" r="150" fill="url(#b-iris)"/>
    <circle cx="352" cy="548" r="90" fill="#050506"/>
    <circle cx="672" cy="548" r="90" fill="#050506"/>
    <circle cx="392" cy="506" r="28" fill="#fff"/><circle cx="712" cy="506" r="28" fill="#fff"/>
    <circle cx="324" cy="584" r="10" fill="#fff" opacity="0.6"/><circle cx="644" cy="584" r="10" fill="#fff" opacity="0.6"/>
    <!-- Brows -->
    <path d="M168 372 Q352 278 500 452" fill="none" stroke="#ece0c8" stroke-width="40" stroke-linecap="round"/>
    <path d="M856 372 Q672 278 524 452" fill="none" stroke="#ece0c8" stroke-width="40" stroke-linecap="round"/>
    <!-- Beak -->
    <path d="M478 640 L546 640 L512 730 Z" fill="#cdb48a"/>
  </g>
</svg>
