[package]
name = "ruru"
version = "0.1.0"
description = "Ruru: a low-latency camera wall for Frigate"
authors = ["Kerwin Carpede"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name,
# see https://github.com/rust-lang/cargo/issues/8519
name = "ruru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ruru"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The in-app updater (Stable channel) and the restart after an update.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Reading the camera list from Frigate's HTTP API, over rustls with the ring
# provider that the updater plugin already uses.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
url = "2"

# WebKitGTK ships with WebRTC off; Ruru turns it on for the main window. The
# version and feature match the ones wry uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
