[package]
name = "ruru"
version = "0.1.0"
description = "Ruru: a low-latency camera wall for Frigate"
authors = ["Kerwin Carpede"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name,
# see https://github.com/rust-lang/cargo/issues/8519
name = "ruru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ruru"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The in-app updater, for the Stable and Edge channels.
tauri-plugin-updater = "2"
# Keeps one copy running: opening Ruru again brings back the running copy, so
# two never share a Home Assistant device or fight over the broker.
tauri-plugin-single-instance = "2"
# Comparing release versions to find the newest Edge build.
semver = "1"
# Reading the camera list from Frigate's HTTP API, over rustls with the ring
# provider that the updater plugin already uses.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
url = "2"
# Talking to the MQTT broker in Home Assistant, over rustls with the same ring
# provider, trusting the system's root certificates for TLS.
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
rustls-native-certs = "0.8"
tokio = { version = "1", features = ["time", "macros"] }
# The computer's name, for the Home Assistant device.
gethostname = "1"
# The broker password, in the macOS Keychain, Windows Credential Manager or the
# Secret Service on Linux. The Secret Service is reached over pure-Rust D-Bus,
# so no system library is needed to build.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }

# WebKitGTK ships with WebRTC off; Ruru turns it on for the main window. The
# version and feature match the ones wry uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
# Checks whether the Secret Service would prompt to unlock before the keyring
# crate asks it to, which would. The version is the one keyring uses.
zbus = { version = "4.4", default-features = false, features = ["async-io"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
