name: CI

# Ordinary PRs link native apps without bundling. Packaging inputs exercise
# the real installers. Use Run workflow with package enabled to force packaging;
# release.yml always packages.
on:
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      # Native resources include licenses and other shipped Markdown.
      - 'src/ruru/src-tauri/**/*.md'
  workflow_dispatch:
    inputs:
      package:
        description: Build and upload installers on every platform
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        description: Version stamped into tauri.conf.json before building.
        type: string
        default: ''
      release_id:
        description: Draft release the installers are uploaded to.
        type: string
        default: ''

# Releases are never cancelled; a newer push to a PR cancels the older run.
concurrency:
  group: ${{ github.workflow == 'Release' && format('release-{0}', github.run_id) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.workflow != 'Release' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Silences git's default-branch hint during checkout.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # Tauri's Linux build dependencies (webkit2gtk 4.1 and friends).
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev
    libayatana-appindicator3-dev
    librsvg2-dev
    libxdo-dev
    libssl-dev
    patchelf
    build-essential
    curl
    wget
    file

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/ruru
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        working-directory: .
        run: sudo python3 .github/scripts/install_linux_deps.py $LINUX_DEPS

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/ruru/src-tauri

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Install dependencies
        working-directory: .
        run: npm ci
      - run: npm run lint
      - name: Test the release scripts
        working-directory: .
        run: python3 -m unittest discover .github/scripts
      # Fails below the floors in vitest.config.ts.
      - run: npm run test:coverage
      # Also produces dist/, which the Rust build embeds.
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # Runs the Rust tests once, instrumented, then writes the reports from
      # that run. Branch coverage needs nightly Rust, so only lines count.
      # The line floor sits 1 point below the 62.96% measured when it was set,
      # and never above 68%.
      - name: Test Rust with coverage
        run: cargo llvm-cov --manifest-path src-tauri/Cargo.toml --no-report
      - name: Write the Rust coverage reports
        run: |
          cargo llvm-cov report --manifest-path src-tauri/Cargo.toml --html
          cargo llvm-cov report --manifest-path src-tauri/Cargo.toml --lcov --output-path src-tauri/target/llvm-cov/lcov.info
          cargo llvm-cov report --manifest-path src-tauri/Cargo.toml --summary-only --fail-under-lines 61

      # Uploaded even when a test or a floor fails, to show what dropped.
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            src/ruru/coverage/
            src/ruru/src-tauri/target/llvm-cov/html/
            src/ruru/src-tauri/target/llvm-cov/lcov.info

  # Runs the Rust tests on Windows and macOS, so code behind #[cfg(windows)]
  # and #[cfg(target_os = "macos")] is tested as well as built. Checks runs
  # them on Linux.
  rust-tests:
    name: Rust tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: src/ruru
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/ruru/src-tauri

      - name: Install dependencies
        working-directory: .
        run: npm ci
      # Produces dist/, which the Rust build embeds.
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build-route:
    runs-on: ubuntu-24.04
    outputs:
      package: ${{ steps.route.outputs.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: route
        shell: bash
        env:
          MANUAL_PACKAGE: ${{ inputs.package }}
        run: bash .github/scripts/packaging_route.sh >> "$GITHUB_OUTPUT"

  build:
    needs: build-route
    name: Build (${{ matrix.platform }})
    # A release build (release.yml, main only) runs in the release
    # environment, which holds the updater and macOS signing secrets. Other
    # builds use no environment and get neither.
    environment: ${{ inputs.release_id != '' && 'release' || '' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo python3 .github/scripts/install_linux_deps.py $LINUX_DEPS

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # The universal macOS app joins an Apple silicon and an Intel build.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # rust-cache does not re-save a cache whose key matched exactly, so a
      # key that ignored the targets would keep restoring a
      # single-architecture cache. Naming the targets in the key gives the
      # universal build a cache of its own.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/ruru/src-tauri
          key: ${{ runner.os == 'macOS' && 'universal-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci

      # A release also builds signed update packages (the .app.tar.gz on
      # macOS; the installers themselves elsewhere) for the in-app updater.
      # Other builds skip them, so they need no signing key.
      - name: Stamp the release version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "src/ruru/src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.version = process.env.VERSION;
            config.bundle.createUpdaterArtifacts = true;
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          '

      # macOS keeps privacy permissions and keychain access by the app's code
      # signature. An ad-hoc signature changes with every build, so every
      # update would lose them; the self-signed certificate in the
      # MACOS_CERTIFICATE secret ("Ruru Self-Signed Code Signing", made by
      # make_macos_signing_cert.sh) keeps the same identity across releases. Tauri's own APPLE_CERTIFICATE import
      # accepts only Apple-issued certificates, so it is imported here and
      # handed to Tauri by name.
      - name: Import the macOS signing certificate
        id: macos-signing
        if: runner.os == 'macOS' && inputs.release_id != ''
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE" ]]; then
            echo "No MACOS_CERTIFICATE secret; the app is signed ad-hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -f pkcs12 \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          # Self-signed, so not "valid" (-v); any identity in this keychain.
          identity=$(security find-identity -p codesigning "$keychain" \
            | sed -n 's/^ *1) [0-9A-F]\{40\} "\(.*\)".*/\1/p')
          if [[ -z "$identity" ]]; then
            security find-identity -p codesigning "$keychain"
            echo "::error::No code-signing identity in MACOS_CERTIFICATE"
            exit 1
          fi
          echo "Signing with \"$identity\""
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      # The macOS app is signed with the APPLE_SIGNING_IDENTITY secret (a paid
      # certificate already in the keychain) when it is set, then with the
      # MACOS_CERTIFICATE one, and ad-hoc ("-") otherwise. Without any
      # signature, Apple silicon reports a downloaded app as "damaged" and
      # refuses to open it.
      # With a release id (release.yml only) the installers, and the update
      # packages with their .sig files, are also uploaded to the draft
      # release; without one, tauri-action only builds. latest.json is left
      # to release.yml, which writes it once every platform is in.
      # On macOS one universal build serves both Apple silicon and Intel, and
      # lands under target/universal-apple-darwin/ rather than target/.
      - name: Link native app without bundling
        if: needs.build-route.outputs.package == 'false'
        working-directory: src/ruru
        run: npm run tauri -- build --no-bundle ${{ runner.os == 'macOS' && '--target universal-apple-darwin' || '' }}

      - name: Build installers
        if: needs.build-route.outputs.package == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || steps.macos-signing.outputs.identity || '-' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src/ruru
          releaseId: ${{ inputs.release_id }}
          includeUpdaterJson: false
          args: ${{ runner.os == 'macOS' && '--target universal-apple-darwin' || '' }}

      # A designated requirement naming a cdhash is the per-build identity
      # that loses permissions on update; a certificate one is stable.
      - name: Check the macOS signature is stable
        if: runner.os == 'macOS' && steps.macos-signing.outputs.identity != ''
        shell: bash
        run: |
          app=src/ruru/src-tauri/target/universal-apple-darwin/release/bundle/macos/Ruru.app
          codesign --verify --strict --verbose=2 "$app"
          requirement=$(codesign -d -r- "$app" 2>&1 | sed -n 's/^designated => //p')
          echo "Designated requirement: $requirement"
          if [[ "$requirement" != *certificate* || "$requirement" == *cdhash* ]]; then
            echo "::error::The app's designated requirement is not tied to the certificate"
            exit 1
          fi

      - name: Upload installers
        if: needs.build-route.outputs.package == 'true'
        uses: actions/upload-artifact@v7
        with:
          # Per runner, so the x86_64 and arm64 Linux builds don't collide.
          name: ruru-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src/ruru/src-tauri/target/release/bundle/deb/*.deb
            src/ruru/src-tauri/target/release/bundle/rpm/*.rpm
            src/ruru/src-tauri/target/release/bundle/appimage/*.AppImage
            src/ruru/src-tauri/target/release/bundle/msi/*.msi
            src/ruru/src-tauri/target/release/bundle/nsis/*.exe
            src/ruru/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
